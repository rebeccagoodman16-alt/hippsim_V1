    how: 'Not a tracing. The thoracic part follows the real MANC v1.2.1 synapse positions on GF body 10000 (1,549 synapses from your gf_axo-axonic
      export): the centreline is the median synapse position in 10 µm steps along their long axis (359 µm). Above it, 300 µm of straight neck
      connective; the brain (soma and dendrites) is replaced by a small node at the top so the cell can be driven. Axon diameter 10 µm, as in
