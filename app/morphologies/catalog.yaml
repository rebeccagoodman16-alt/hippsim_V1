    name: CA1 pyramidal cell
    code: mpg141209_A
    region: CA1
    system: Hippocampal formation
    group: Pyramidal & principal cells
    layer: Soma in stratum pyramidale; basal dendrites in oriens, apical dendrite through radiatum to lacunosum-moleculare
    species: Rat
    how: Filled during whole-cell recording in hippocampal slices, imaged and traced in Neurolucida, with the layer boundaries traced too.
    role: Main output of the hippocampus. Integrates CA3 input (Schaffer collaterals, middle dendrites) with entorhinal input (distal tuft) and
      projects to subiculum and entorhinal cortex.
