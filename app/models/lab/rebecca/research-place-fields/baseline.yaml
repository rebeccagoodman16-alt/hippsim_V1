page: sim-lab-models.html
origin: lab/rebecca
kind: simulation
level: 4
question: Does a single plateau create a place field, and which code do its spikes use?
model: Treadmill laps, CA3 inputs with preferred positions, EC theta; behavioural-timescale synaptic plasticity
  (BTSP) triggered by a dendritic plateau.
biology: BTSP strengthens inputs active in the seconds around a plateau (Bittner et al. 2017); spikes then split
  into burst and single-spike codes.
units: V mV · t ms · I µA/cm² · g mS/cm² (all per membrane area)
