origin: lab/rebecca
kind: simulation
level: 4
question: Why do single spikes lock to gamma and bursts to theta in CA1-like cells?
model: 'Model ladder from Ceballos, Chadly, Lowet & Pena 2025: two-point LIF → GLIF (Teeter 2018) → AdEx → biophysical
  two-compartment HH. Soma: INaT, INaP, IKdr, IKA, IKM, IHCa, IfKCa, IsKCa with [Ca²⁺] (Golomb 2006 kinetics); dendrite:
  leak + Iₕ; RK4, Δt = 0.02 ms.'
biology: Persistent Na⁺ (Nav) and M current (Kv7) at the soma set burst propensity; dendritic HCN (Iₕ) adds resonance;
  theta (EC) and gamma (CA3) drive arrive as sinusoidal currents.
units: V mV · t ms · I µA/cm² · g mS/cm² (all per membrane area)
