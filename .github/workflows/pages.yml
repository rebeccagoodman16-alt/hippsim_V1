# Publish the installable hippsim app (app/, built by tools/build_app.py) to GitHub Pages on every push to main.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# The app is then at https://<user>.github.io/hippsim_V1/ ; open it on a phone and "Add to Home Screen" / "Install".
name: Deploy app to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
