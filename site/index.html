<style>
:root{
  --bg:#fff9f2; --surface:#fffdfa; --ink:#1b1616; --muted:#75665f; --rule:#e8dbd1; --line:#cdb8ad; --code:#f5ece4;
  --apical:#a62961; --basal:#3d5a8a; --axon:#9a6a33; --accent:#a62961; --on-accent:#ffffff;
  --trunk:#6b1a3f; --oblique:#d0679a; --tuft:#e0a03a;
  --f-display:Georgia,"Times New Roman",serif; --f-body:system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html[data-hs-palette="contrast"]{--trunk:#7a2e00;--oblique:#cc79a7;--tuft:#e69f00}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
a{color:var(--accent)} button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1}
.mono{font-family:var(--f-mono);font-size:.88em}
.muted{color:var(--muted)}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;padding-top:22px}
.top h1{font-size:clamp(1.7rem,4vw,2.3rem);font-weight:800;letter-spacing:-.02em}
.find{position:relative;flex:0 1 420px;min-width:min(100%,280px)}
.find input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:15px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:12px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.12);overflow:hidden}
.sugg button{display:flex;gap:10px;width:100%;text-align:left;padding:8px 12px;border:0;background:none;cursor:pointer;align-items:center}
.sugg button[aria-selected="true"],.sugg button:hover{background:var(--code)}
.sugg small{color:var(--muted);margin-left:auto;font-family:var(--f-mono);font-size:11px}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump a{font-size:13px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:var(--surface)}
.jump a span{color:var(--muted);font-family:var(--f-mono);font-size:11px;margin-left:3px}
.wrap > main{width:100%}
.sys{display:flex;flex-direction:column;gap:18px}
.sys > h2{font-size:1.35rem;border-bottom:1px solid var(--rule);padding-bottom:6px}
.reg h3{font:600 15px var(--f-body);margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.reg h3 span{font:500 11.5px var(--f-mono);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.cell{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:5px;padding:8px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);min-width:0}
.cell:hover{border-color:var(--accent)} .cell:focus-visible{outline:2px solid var(--accent)}
.cell svg{width:100%;aspect-ratio:1/1;background:var(--code);border-radius:8px}
.cell svg path{fill:none;stroke-width:.8;vector-effect:non-scaling-stroke;stroke-linecap:round}
.cell .ap{stroke:var(--apical)}.cell .ba{stroke:var(--basal)}.cell .ax{stroke:var(--axon);opacity:.5}.cell .so{fill:var(--ink)}
.cell b{font-size:12.5px;line-height:1.25;font-weight:600}
.cell .mono{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- full-screen viewer ---------- */
#viewer{position:fixed;inset:0;z-index:1000;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr auto}
#viewer[hidden]{display:none}
.vbar{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px max(14px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--rule);background:var(--surface)}
.vbar h2{font-size:1.15rem}
.vbar .sub{font-size:12.5px;color:var(--muted)}
.vbar .sp{flex:1}
@media (max-width:760px){.vbar .lg{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} .vbar .btn{padding:7px 10px} .vbar > div{flex:1 1 60%;min-width:0} .vbar .sp{display:none} #vsim{order:5}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage{grid-row:2;grid-column:1;position:relative;min-width:0;min-height:0;touch-action:none;cursor:grab}
.stage:active{cursor:grabbing}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.35;padding:6px 9px;border-radius:8px;max-width:260px;z-index:3;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.tip b{display:block;font-size:13px}
.hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--muted);pointer-events:none}
.parts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:8px max(14px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule);background:var(--surface)}
.parts .lbl{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.part{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px 5px 8px;font-size:13px;cursor:pointer;background:var(--surface)}
.part i{width:14px;height:4px;border-radius:2px;display:inline-block}
.part[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.part.hl{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 10px;font-size:12.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
aside.side{grid-row:2;grid-column:2;width:min(360px,92vw);border-left:1px solid var(--rule);background:var(--surface);overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px;font-size:14px}
aside.side[hidden]{display:none}
@media (max-width:760px){#viewer{grid-template-columns:1fr} .stage{grid-row:2;grid-column:1} aside.side{grid-row:2;grid-column:1;justify-self:end;height:100%;width:min(340px,88vw);z-index:5;box-shadow:-10px 0 30px rgba(0,0,0,.15)}}
.side h3{font:700 13px var(--f-body)}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}
.side .note{font-size:12px;color:var(--muted)}
.side svg{width:100%;height:auto;display:block}
.side svg text{font:10px var(--f-mono);fill:var(--muted)}
/* simulate chooser */
dialog#sim{border:1px solid var(--line);border-radius:16px;padding:0;max-width:min(720px,94vw);background:var(--surface);color:var(--ink)}
dialog#sim::backdrop{background:rgba(0,0,0,.35)}
.simh{padding:16px 18px 6px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.simh h2{font-size:1.3rem}
.simq{padding:0 18px 6px;font-size:14px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:8px 18px 18px}
.opt{border:1px solid var(--rule);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.opt h3{font:700 14.5px var(--f-body)}
.opt p{margin:0;font-size:13px;color:var(--muted);flex:1}
.opt .row{display:flex;flex-wrap:wrap;gap:6px}
.opt .btn{padding:6px 11px;font-size:12.5px}
.simf{padding:10px 18px 16px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--muted)}

/* simulator panel */
.simp .sh{display:flex;justify-content:space-between;align-items:baseline}
.sl{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px;font-size:13.5px}
.sl input{flex:1 1 100%;accent-color:var(--accent)}
.sl output{font-variant-numeric:tabular-nums;color:var(--muted)}
.srow{margin:0;font-size:13.5px}
.linkish{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.linkish[aria-pressed="true"]{font-weight:700}
.btn.run{justify-content:center;font-size:15px;padding:10px}
.trace{position:relative;height:150px;background:var(--code);border-radius:8px}
.trace canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.sres{margin:0;font-size:13.5px}
.base{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13px}
.base dt{color:var(--muted);font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;padding-top:2px}
.base dd{margin:0}
.base dd.chg{color:var(--accent);font-weight:600}
[hidden]{display:none!important}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:none;padding:7px 8px;font-size:13px;cursor:pointer;color:var(--ink)}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.seg.sm button{padding:5px 8px;font-size:12.5px}
.setup{display:flex;flex-direction:column;gap:10px}
.mlist{display:flex;flex-direction:column;gap:6px}
.mlist button{all:unset;cursor:pointer;display:block;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
.mlist button[aria-checked="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mlist b{display:block;font-size:13.5px}
.mlist span{display:block;font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px}
.simrow{display:flex;align-items:center;gap:10px}
.simrow .lbl{font-size:12px;color:var(--muted);white-space:nowrap}
.simrow .seg{flex:1}
.simrow .fixed{font-size:12.5px;color:var(--muted)}
.chosen{font-size:13px;color:var(--muted);margin:0}
.chosen b{color:var(--ink)}
.out{display:flex;flex-direction:column;gap:12px}
.step{margin:4px 0 -2px;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.step b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:11px;margin-right:6px}
.tlist{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tlist button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:var(--surface);font-size:12.5px;line-height:1.3}
.tlist button b{display:block;font-size:13px}
.tlist button span{color:var(--muted);font-size:11.5px}
.tlist button[aria-checked="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.readout{width:100%;border-collapse:collapse;font-size:13px}
.readout td{padding:4px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.readout td:first-child{color:var(--muted)}
.readout td.v{text-align:right;font-variant-numeric:tabular-nums}
.readout td.b{text-align:right;color:var(--muted);font-size:12px;padding-left:10px;white-space:nowrap}
.readout td.chg{color:var(--accent);font-weight:600}
.bdet summary{cursor:pointer;font-size:13px;font-weight:600}
.bdet[open] summary{margin-bottom:8px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.grp{display:flex;flex-direction:column;gap:6px}
.gh{margin:0;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
details.pg{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;background:var(--surface)}
details.pg summary{cursor:pointer;font-size:13px;font-weight:600;display:flex;justify-content:space-between}
details.pg summary em{font-style:normal;color:var(--accent);font-weight:600;font-size:12px}
details.pg[open] summary{margin-bottom:8px}
details.pg .sl{margin-bottom:8px}
#sctl{display:flex;flex-direction:column;gap:8px}
.tg{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:4px 0}
.tg input{accent-color:var(--accent)}
.sel{display:flex;flex-direction:column;gap:4px;font-size:13.5px;margin-bottom:8px}
.sel select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.chips.tools button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.marks{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.marks li{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 9px;display:flex;align-items:center;gap:4px}
.marks li i{width:9px;height:9px;border-radius:50%;display:inline-block}
.marks li button{all:unset;cursor:pointer;padding:0 5px;color:var(--muted)}
aside.side > *{flex:none}
.sman{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--rule);padding-top:12px}
.sman[hidden]{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:12.5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vleg{position:absolute;left:14px;bottom:12px;display:flex;align-items:center;gap:6px;font:11px var(--f-mono);color:var(--muted);background:color-mix(in srgb,var(--bg) 80%,transparent);padding:3px 6px;border-radius:6px}
.vleg i{display:block;width:90px;height:8px;border-radius:4px}
.vleg[hidden]{display:none}
@media (min-width:1200px){#viewer{grid-template-columns:1fr auto auto} aside.simp{grid-column:3}}
.sfoot{display:flex;justify-content:space-between;align-items:center;gap:8px}
#vsim[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
@media (max-width:760px){#viewer{grid-template-rows:auto 1fr auto auto} aside.simp{grid-row:3;grid-column:1;justify-self:stretch;width:auto;height:auto;max-height:46vh;border-left:0;border-top:1px solid var(--rule);box-shadow:0 -8px 24px rgba(0,0,0,.08);gap:10px;padding:10px 14px}
  .simp .trace{height:110px} .simp .note{display:none} #parts{grid-row:4} .parts{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none} .parts .part,.parts .seg button{white-space:nowrap}}
</style>

<header></header>
<div class="wrap">
  <div class="top">
    <div><h1>Neurons</h1><p class="muted" id="sub"></p></div>
    <div class="find" role="combobox" aria-expanded="false" aria-haspopup="listbox">
      <input id="q" type="search" placeholder="Type a cell: CA1, granule, n123, Amaral…" aria-label="Find a neuron" autocomplete="off" aria-controls="sugg">
      <div class="sugg" id="sugg" role="listbox" hidden></div>
    </div>
  </div>
  <nav class="jump" id="jump" aria-label="Regions"></nav>
  <main id="list"></main>
</div>

<div id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="vname">
  <div class="vbar">
    <button class="btn" id="vback" title="Back to all neurons (Esc)">← All neurons</button>
    <div><h2 id="vname"></h2><div class="sub" id="vsub"></div></div>
    <span class="sp"></span>
    <button class="btn" id="vspin" aria-pressed="false" title="Turn slowly (space)"><span aria-hidden="true">⟳</span><span class="lg">Rotate</span></button>
    <button class="btn" id="vreset" title="Front view (0)"><span aria-hidden="true">↺</span><span class="lg">Reset view</span></button>
    <button class="btn" id="vshot" title="Save a PNG of this view"><span aria-hidden="true">⤓</span><span class="lg">Screenshot</span></button>
    <button class="btn" id="vvid" title="Record one full turn (8 s)"><span aria-hidden="true">⏺</span><span class="lg">Video</span></button>
    <button class="btn" id="vside" aria-pressed="false" aria-controls="side">Details</button>
    <button class="btn primary" id="vsim" aria-pressed="false" aria-controls="simp">▶ Simulate</button>
  </div>
  <div class="stage" id="stage"><canvas id="cv" aria-label="3D neuron. Drag to rotate, scroll or pinch to zoom."></canvas>
    <div class="tip" id="tip" hidden></div><div class="vleg" id="vleg" hidden><span>−80</span><i id="vgrad"></i><span>+30 mV</span><span id="vt"></span></div><div class="hint" id="hint" hidden>Drag to rotate · scroll or pinch to zoom · hover or tap a branch</div></div>
  <aside class="side" id="side" hidden aria-label="Details"></aside>
  <aside class="side simp" id="simp" hidden aria-label="Simulate">
    <div class="sh"><h3 id="stitle">Simulate</h3><button class="linkish" id="sclose" aria-label="Close simulator">Close</button></div>
    <div class="setup" id="ssetup">
      <p class="step"><b>1</b> Scale</p>
      <div class="seg" id="sscale" role="radiogroup" aria-label="Scale"><button data-s="cell">Single cell</button><button data-s="circuit">Circuit</button><button data-s="population">Population</button></div>
      <p class="step"><b>2</b> Model</p>
      <div class="mlist" id="smodels" role="radiogroup" aria-label="Model"></div>
      <p class="step"><b>3</b> Test</p>
      <div class="tlist" id="stests" role="radiogroup" aria-label="Test"></div>
      <div class="simrow" id="ssimrow"><span class="lbl">Run in</span><div class="seg sm" id="ssims" role="radiogroup" aria-label="Simulator"></div></div>
      <button class="btn primary run" id="sgo">▶ Run baseline</button>
    </div>
    <div class="chosen" id="schosen" hidden><span id="schosent"></span> <button class="linkish" id="schange">change</button></div>
    <div class="out" id="sout" hidden>
      <div class="trace"><canvas id="trace" aria-label="Simulation result"></canvas></div>
      <p class="sres" id="sres" aria-live="polite"></p>
      <table class="readout" id="sread"></table>
      <details class="bdet" id="sbdet"><summary>Baseline values and sources</summary><dl class="base" id="sbase"></dl></details>
      <button class="btn primary run" id="smanip" aria-expanded="false" aria-controls="sman">Manipulate the baseline</button>
      <div class="sman" id="sman" hidden>
        <div class="mhead"><span id="snch">At baseline</span><button class="linkish" id="sreset">back to baseline</button></div>
        <div class="grp"><p class="gh">Published manipulations</p><div class="chips" id="spre" role="group" aria-label="Manipulations"></div></div>
        <div class="grp" id="stoolg"><p class="gh">Branch tools <span class="muted">· pick one, tap the cell</span></p><div class="chips tools" id="stools"></div><ul class="marks" id="smarks"></ul><div id="stoolp"></div></div>
        <div id="sctl"></div>
        <button class="btn primary run" id="srun">▶ Run</button>
        <p class="note" id="sextnote" hidden></p>
      </div>
      <div class="sfoot"><button class="btn" id="ssave">Save run</button><span><a class="linkish" id="sdoc" href="docs.html#models" target="_blank" rel="noopener">How this model works</a> <button class="linkish" id="spy" hidden></button></span></div>
    </div>
  </aside>
  <div class="parts" id="parts"></div>
</div>

 38 78 36 77 35 76 33 75 32 74 30 73 29 71 29 69 29 67 28 66 28 64 28 62 28 60 27 58 27 56 26 54 26 52 25 51 25 49 24 48 23 46M42 80 41 79 40 77 40 75 39 74 38 72 38 70 37 69 37 67 37 65 36 64 36 62 35 61 34 60 34 58 33 57 33 55 32 54 32 52 32 50 32 48 32 46 32 44 33 43 33 41M59 91 60 92 61 91 62 90 63 89M63 89 64 87 64 85M64 85 64 83 64 81 65 79 65 77M65 77 65 75 66 74 66 72 67 71 67 69 68 68 68 66 69 65 69 63 70 62 70 60 71 59 72 58 72 56 73 55 73 53 74 52 75 50 75 48 76 47 76 45M65 77 66 76 67 75 67 73 68 72M68 71 69 69 70 67 70 65 71 64 72 62 73 60 73 58 73 56 74 55 74 53 75 51 76 50M68 71 69 70 70 69 71 68 72 66 73 65 74 64 74 62 75 61 76 60 77 58 78 57 79 56 80 55 81 53 82 51 82 49 83 48M64 85 66 84 67 83 68 82 69 81 70 80 71 78 71 76 72 75M72 75 73 74 73 72 74 71 75 70 75 68 76 67 77 66 78 64 79 62 80 60 80 58 81 56 81 54 82 53 83 51 84 50 85 48M72 75 73 74M73 74 74 73 75 72 76 71 78 70 79 68 80 67 81 65 82 63 83 62 84 60 85 58 86 57 86 55 87 54 88 53 89 52 89 50 90 49M73 74 75 73 77 73 79 72 81 72 83 71 85 70 86 69 88 68 89 66 90 65 92 64 94 63 96 63M63 89 64 88 65 87 66 86M66 85 66 83 67 82 67 80 68 78M68 77 69 75 69 73 69 71 69 69 69 67 69 65 68 63M68 77 69 75 70 74 70 72 71 71 72 69 73 67 73 65 74 63 74 61 75 60 76 58 77 57 77 55 78 54 79 53 80 52 80 50 81 49M66 85 67 84 66 83 66 81 67 80 67 78 67 76 68 75 69 73 69 71 70 70 71 69 72 68 73 67 74 66 74 64 75 63 76 62 77 61 78 60 79 59","x":"M59 91 5 7 5 9 4 11 3 12","s":[59,91]},"prov":{"archive":"ModelDB"},"axonHidden":false}],"scripts":{"brian2_network":"\"\"\"Population dynamics in Brian2: Brunel (2000) sparse excitatory–inhibitory network of leaky integrate-and-fire neurons.\nGenerated by hippsim (Neuron atlas → Simulate → Population). Point neurons: the reconstruction of {NAME} sets only the\nmembrane time constant here (τ = Rm·Cm = 20 ms, as in hippsim's passive check). Brunel N (2000) J Comput Neurosci 8:183–208.\nNeeds: pip install brian2 matplotlib. Try g (inhibition/excitation) 3–6 and nu_ext/nu_thr 0.9–4 for the four regimes.\"\"\"\nfrom brian2 import *\nimport matplotlib.pyplot as plt\n\nN_E, N_I = 8000, 2000; eps = 0.1; C_E, C_I = int(eps*N_E), int(eps*N_I)\ntau, theta, V_r, tau_rp, J, D = 20*ms, 20*mV, 10*mV, 2*ms, 0.1*mV, 1.5*ms\ng, nu_ratio = {G_RATIO}, {NU_RATIO}          # from hippsim (Brunel 2000 Fig. 8: SR 3, 2 · SI fast 6, 4 · AI 5, 2 · SI slow 4.5, 0.9)\nnu_thr = theta/(J*C_E*tau)\nG = NeuronGroup(N_E + N_I, \"dv/dt = -v/tau : volt (unless refractory)\", threshold=\"v > theta\", reset=\"v = V_r\",\n                refractory=tau_rp, method=\"exact\")\nG.v = \"V_r + rand()*(theta - V_r)\"\nE, I = G[:N_E], G[N_E:]\nSE = Synapses(E, G, on_pre=\"v += J\", delay=D); SE.connect(p=eps)\nSI = Synapses(I, G, on_pre=\"v += -g*J\", delay=D); SI.connect(p=eps)\next = PoissonInput(G, \"v\", C_E, nu_ratio*nu_thr, weight=J)\nspk = SpikeMonitor(G[:50]); rate = PopulationRateMonitor(G)\nrun(300*ms)\nprint(f\"mean rate {rate.smooth_rate(width=5*ms)[len(rate.t)//3:].mean()/Hz:.1f} Hz (g = {g}, nu_ext/nu_thr = {nu_ratio})\")\nfig, ax = plt.subplots(2, 1, sharex=True)\nax[0].plot(spk.t/ms, spk.i, \".k\", ms=2); ax[0].set_ylabel(\"neuron\")\nax[1].plot(rate.t/ms, rate.smooth_rate(width=1*ms)/Hz); ax[1].set_ylabel(\"rate (Hz)\"); ax[1].set_xlabel(\"time (ms)\")\nplt.show()\n","neuron_single":"\"\"\"{NAME} ({ID}): current step in NEURON. Generated by hippsim (Neurons → Simulate → Run it in → NEURON).\nNeeds: pip install neuron matplotlib, and {SWC_FILE} next to this script.\nModel (same as hippsim's browser engine and the Brian2 script): the reconstruction with leak Rm 20 kΩ·cm²,\nRa 150 Ω·cm, Cm 1 µF/cm² and Hodgkin–Huxley Na/K at 6.3 °C (gNa 0.5, gK 0.1 S/cm² in soma and axon, a fraction\nof that in dendrites). A starting point to edit, not a fitted model.\"\"\"\nfrom neuron import h\nimport matplotlib.pyplot as plt\n\n# ---- settings (from hippsim; edit freely) ----\nAMP = {AMP_NA}          # nA, 300 ms step starting at 50 ms\nNA_SCALE = {NA_SCALE}     # × gNa 0.5 S/cm²\nK_SCALE = {K_SCALE}      # × gK 0.1 S/cm²\nDEND = {DEND_FRAC}       # dendritic channel density, fraction of soma\nSITE = {SITE_XYZ}       # electrode: None = soma, or (x, y, z) in the SWC's µm coordinates ({SITE_LABEL})\n\ndef clean_swc(src, dst):\n    \"\"\"Drop points that sit exactly on their parent (re-parent their children): zero-length sections break the cable\n    equation. Radii below 0.05 µm (tracing artefacts) become 0.05 µm. Same cleaning as the Brian2 script.\"\"\"\n    rows = {}\n    for line in open(src):\n        if line.strip() and not line.startswith(\"#\"):\n            i, t, x, y, z, rad, p = line.split()[:7]; rows[int(i)] = [int(t), float(x), float(y), float(z), max(float(rad), 0.05), int(p)]\n    alias = {}\n    for i, (t, x, y, z, rad, p) in rows.items():\n        p = alias.get(p, p)\n        if p in rows and t != 1 and (x, y, z) == tuple(rows[p][1:4]): alias[i] = p\n        rows[i][5] = p\n    with open(dst, \"w\") as f:\n        for i, (t, x, y, z, rad, p) in rows.items():\n            if i not in alias: f.write(f\"{i} {t} {x} {y} {z} {rad} {p}\\n\")\n    return dst\n\nh.load_file(\"stdrun.hoc\"); h.load_file(\"import3d.hoc\")\nr = h.Import3d_SWC_read(); r.input(clean_swc(\"{SWC_FILE}\", \"neuron_{SWC_FILE}\"))\nh.Import3d_GUI(r, False).instantiate(None)\nsoma = h.soma[0]\nfor s in h.allsec():\n    s.cm = 1; s.Ra = 150\n    s.nseg = 1 if s.L < 1e-3 else int((s.L / (0.1 * h.lambda_f(100, sec=s)) + 0.9) / 2) * 2 + 1   # d_lambda = 0.1\n    s.insert(\"hh\")\n    f = 1.0 if s.name().startswith((\"soma\", \"axon\")) else DEND\n    for seg in s:\n        seg.hh.gnabar, seg.hh.gkbar, seg.hh.gl, seg.hh.el = 0.5 * NA_SCALE * f, 0.1 * K_SCALE * f, 1 / 20000, -65\n\ndef nearest(xyz):\n    best = (1e18, soma, 0.5)\n    for s in h.allsec():\n        for i in range(s.n3d()):\n            d = (s.x3d(i) - xyz[0]) ** 2 + (s.y3d(i) - xyz[1]) ** 2 + (s.z3d(i) - xyz[2]) ** 2\n            if d < best[0]: best = (d, s, s.arc3d(i) / s.L if s.L else 0.5)\n    return best[1](min(max(best[2], 0), 1))\n\nsite = soma(0.5) if SITE is None else nearest(SITE)\nstim = h.IClamp(site); stim.delay, stim.dur, stim.amp = 50, 300, AMP\nt, v, ve = h.Vector().record(h._ref_t), h.Vector().record(soma(0.5)._ref_v), h.Vector().record(site._ref_v)\nh.celsius = 6.3; h.finitialize(-65); h.dt = 0.025; h.continuerun(400)\n\ntt, vv = list(t), list(v)\nspk = [tt[i + 1] for i in range(len(vv) - 1) if vv[i] < 0 <= vv[i + 1] and 50 <= tt[i + 1] < 350]\nprint(f\"RESULT engine=NEURON spikes={len(spk)} first_ms={spk[0] - 50 if spk else 'none'}\")\nimport os\nif os.environ.get(\"HIPPSIM_TRACE\"):                              # used by hippsim's engine check (soma V every 0.5 ms)\n    print(\"TRACE\", [round(vv[i], 1) for i in range(0, len(vv), 20)])\nprint(f\"{NAME}: {len(spk)} spikes during a {AMP} nA, 300 ms step at {'the soma' if SITE is None else site}\")\nplt.plot(t, v, lw=0.8, label=\"soma\")\nif SITE is not None: plt.plot(t, ve, lw=0.8, label=\"electrode\")\nplt.xlabel(\"time (ms)\"); plt.ylabel(\"V (mV)\"); plt.title(\"{NAME} ({ID}) · NEURON\"); plt.legend(); plt.show()\n","brian2_single":"\"\"\"{NAME} ({ID}): current step in Brian2 (SpatialNeuron). Generated by hippsim (Neurons → Simulate → Run it in → Brian2).\nNeeds: pip install brian2 matplotlib, and {SWC_FILE} next to this script.\nModel (same as hippsim's browser engine and the NEURON script): the reconstruction with leak Rm 20 kΩ·cm²,\nRi 150 Ω·cm, Cm 1 µF/cm² and Hodgkin–Huxley Na/K at 6.3 °C (gNa 0.5, gK 0.1 S/cm² in soma and axon, a fraction\nof that in dendrites). Equations follow the Brian2 \"spatial neuron\" example. A starting point to edit.\"\"\"\nfrom brian2 import *\nimport matplotlib.pyplot as plt\n\n# ---- settings (from hippsim; edit freely) ----\nAMP = {AMP_NA}          # nA, 300 ms step starting at 50 ms\nNA_SCALE = {NA_SCALE}     # × gNa 0.5 S/cm²\nK_SCALE = {K_SCALE}      # × gK 0.1 S/cm²\nDEND = {DEND_FRAC}       # dendritic channel density, fraction of soma\nSITE = {SITE_XYZ}       # electrode: None = soma, or (x, y, z) in the SWC's µm coordinates ({SITE_LABEL})\n\ndef clean_swc(src, dst):\n    \"\"\"Brian2 needs every compartment to have length: drop points that sit exactly on their parent (re-parent children).\n    Returns the root point's coordinates (Brian2 puts the root at the origin).\"\"\"\n    rows = {}\n    for line in open(src):\n        if line.strip() and not line.startswith(\"#\"):\n            i, t, x, y, z, r, p = line.split()[:7]; rows[int(i)] = [int(t), float(x), float(y), float(z), max(float(r), 0.05), int(p)]   # radius ≥ 0.05 µm\n    alias = {}\n    for i, (t, x, y, z, r, p) in rows.items():\n        p = alias.get(p, p)\n        if p in rows and t != 1 and (x, y, z) == tuple(rows[p][1:4]): alias[i] = p\n        rows[i][5] = p\n    with open(dst, \"w\") as f:\n        for i, (t, x, y, z, r, p) in rows.items():\n            if i not in alias: f.write(f\"{i} {t} {x} {y} {z} {r} {p}\\n\")\n    root = next(v for v in rows.values() if v[5] == -1)\n    return root[1:4]\n\ndefaultclock.dt = 0.025*ms\nroot = clean_swc(\"{SWC_FILE}\", \"brian2_{SWC_FILE}\")\nmorpho = Morphology.from_file(\"brian2_{SWC_FILE}\")\nEL, ENa, EK = -65*mV, 50*mV, -77*mV\neqs = \"\"\"\nIm = gL*(EL - v) + gNa*m**3*h*(ENa - v) + gK*n**4*(EK - v) : amp/meter**2\nI : amp (point current)\ngNa : siemens/meter**2\ngK : siemens/meter**2\ndm/dt = alpham*(1-m) - betam*m : 1\ndn/dt = alphan*(1-n) - betan*n : 1\ndh/dt = alphah*(1-h) - betah*h : 1\nalpham = (0.1/mV)*10*mV/exprel((-v - 40*mV)/(10*mV))/ms : Hz\nbetam = 4*exp((-v - 65*mV)/(18*mV))/ms : Hz\nalphah = 0.07*exp((-v - 65*mV)/(20*mV))/ms : Hz\nbetah = 1/(exp((-v - 35*mV)/(10*mV)) + 1)/ms : Hz\nalphan = (0.01/mV)*10*mV/exprel((-v - 55*mV)/(10*mV))/ms : Hz\nbetan = 0.125*exp((-v - 65*mV)/(80*mV))/ms : Hz\n\"\"\"\ngL = 1/(20*kohm*cm**2)\nneuron = SpatialNeuron(morphology=morpho, model=eqs, method=\"exponential_euler\",\n                       Cm=1*uF/cm**2, Ri=150*ohm*cm, refractory=\"m > 0.4\", threshold=\"m > 0.5\")\ndef sections(s):\n    yield s\n    for c in s.children: yield from sections(c)\nneuron.gNa = 500*DEND*NA_SCALE*msiemens/cm**2; neuron.gK = 100*DEND*K_SCALE*msiemens/cm**2   # dendrites\nfor s in sections(morpho):\n    if s.type in (\"soma\", \"axon\"):                                                           # soma and axon: full density\n        neuron[s].gNa = 500*NA_SCALE*msiemens/cm**2; neuron[s].gK = 100*K_SCALE*msiemens/cm**2\nneuron.v = EL\nneuron.m = 0.0529; neuron.h = 0.5961; neuron.n = 0.3177      # gates start at their steady state at -65 mV\nk = 0\nif SITE is not None:\n    d = (neuron.x/um + root[0] - SITE[0])**2 + (neuron.y/um + root[1] - SITE[1])**2 + (neuron.z/um + root[2] - SITE[2])**2\n    k = int(argmin(d))\nmon = StateMonitor(neuron, \"v\", record=[0, k])\nrun(50*ms); neuron.I[k] = AMP*nA; run(300*ms); neuron.I[k] = 0*amp; run(50*ms)\n\ntv, vs = mon.t/ms, mon[0].v/mV                                # spikes: soma crossing 0 mV (as in NEURON and hippsim)\nst = [float(tv[i + 1]) for i in range(len(vs) - 1) if vs[i] < 0 <= vs[i + 1] and 50 <= tv[i + 1] < 350]\nprint(f\"RESULT engine=Brian2 spikes={len(st)} first_ms={st[0] - 50 if st else 'none'}\")\nimport os\nif os.environ.get(\"HIPPSIM_TRACE\"):                              # used by hippsim's engine check (soma V every 0.5 ms)\n    print(\"TRACE\", [round(float(x), 1) for x in vs[::20]])\nprint(f\"{NAME}: {len(st)} spikes during a {AMP} nA, 300 ms step at {'the soma' if SITE is None else 'compartment %d' % k}\")\nplt.plot(mon.t/ms, mon[0].v/mV, lw=0.8, label=\"soma\")\nif k: plt.plot(mon.t/ms, mon[k].v/mV, lw=0.8, label=\"electrode\")\nplt.xlabel(\"time (ms)\"); plt.ylabel(\"V (mV)\"); plt.title(\"{NAME} ({ID}) · Brian2\"); plt.legend(); plt.show()\n"},"eng":{"ca1-a":{"js":{"spikes":18,"first_ms":2.95},"neuron":{"spikes":18,"first_ms":2.98},"brian2":{"spikes":18,"first_ms":2.98},"date":"2026-11-05"},"ca1-b":{"js":{"spikes":18,"first_ms":2.55},"neuron":{"spikes":18,"first_ms":2.5 const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fmt = n => n == null || n === "" ? "–" : Number(n).toLocaleString("en-US", {maximumFractionDigits: 1});
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const cap = n => (window.claude && typeof window.claude.use === "function") ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
async function saveFile(name, blob) {           // claude.ai downloads capability, else an ordinary download
  const dl = await cap("downloads");
  if (dl) { try { await dl.save({filename: name, data: blob}); return; } catch (e) {} }
  const a = Object.assign(document.createElement("a"), {href: URL.createObjectURL(blob), download: name});
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ================= index: neurons only, grouped by system and region ================= */
const ORDER = ["Dentate gyrus", "CA3", "CA2", "CA1", "Subiculum", "Entorhinal cortex", "Medial septum"];
const SYS = ["Hippocampal formation", "Beyond the hippocampus"];
const thumb = c => { const t = c.thumb || {}; return `<svg viewBox="0 0 100 100" aria-hidden="true">${t.x ? `<path d="${t.x}" class="ax"/>` : ""}${t.b ? `<path d="${t.b}" class="ba"/>` : ""}${t.a ? `<path d="${t.a}" class="ap"/>` : ""}${t.s ? `<circle cx="${t.s[0]}" cy="${t.s[1]}" r="2.2" class="so"/>` : ""}</svg>`; };
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-");
function renderIndex() {
  $("sub").textContent = `${D.cells.length} reconstructed neurons. Pick one to see it in 3D and simulate it.`;
  const by = {};
  D.cells.forEach(c => ((by[c.system] = by[c.system] || {})[c.region] = by[c.system][c.region] || []).push(c));
  const regs = s => Object.keys(by[s] || {}).sort((a, b) => ((ORDER.indexOf(a) + 1 || 99) - (ORDER.indexOf(b) + 1 || 99)) || a.localeCompare(b));
  $("jump").innerHTML = SYS.flatMap(s => regs(s).map(r => `<a href="#r-${slug(r)}">${esc(r)}<span>${by[s][r].length}</span></a>`)).join("");
  $("list").innerHTML = SYS.filter(s => by[s]).map(s => `<section class="sys"><h2>${esc(s)}</h2>${regs(s).map(r => {
    const gk = g => /^Pyramidal|principal/i.test(g) ? 0 : 1;                       // principal cells first, then interneurons
    const cells = by[s][r].sort((a, b) => gk(a.group) - gk(b.group) || a.group.localeCompare(b.group) || a.name.localeCompare(b.name) || (a.code || "").localeCompare(b.code || ""));
    return `<div class="reg" id="r-${slug(r)}"><h3>${esc(r)} <span>${cells.length}</span></h3><div class="grid">${cells.map(c =>
      `<button class="cell" data-id="${esc(c.id)}" title="${esc(c.name)} · ${esc(c.species)}">${thumb(c)}<b>${esc(c.name)}</b><span class="mono">${esc(c.code || c.id)}</span></button>`).join("")}</div></div>`;
  }).join("")}</section>`).join("");
}
$("list").addEventListener("click", e => { const b = e.target.closest(".cell"); if (b) open(b.dataset.id); });

/* search with suggestions: type, arrows, Enter opens */
let sel = 0, hits = [];
function suggest() {
  const q = $("q").value.trim().toLowerCase(), box = $("sugg");
  hits = !q ? [] : D.cells.map(c => { const hay = [c.id, c.name, c.code, c.region, c.species, c.group, (c.prov || {}).archive].join(" ").toLowerCase();
    return [c, hay.includes(q) ? (c.id === q || (c.code || "").toLowerCase().startsWith(q) ? 0 : 1) : q.split(/\s+/).every(w => hay.includes(w)) ? 2 : 9]; })
    .filter(x => x[1] < 9).sort((a, b) => a[1] - b[1]).slice(0, 8).map(x => x[0]);
  sel = 0; box.hidden = !hits.length; $("q").parentElement.setAttribute("aria-expanded", String(!!hits.length));
  box.innerHTML = hits.map((c, i) => `<button role="option" data-id="${esc(c.id)}" aria-selected="${i === sel}"><b>${esc(c.name)}</b> <span class="mono">${esc(c.code || "")}</span><small>${esc(c.region)}</small></button>`).join("");
}
$("q").addEventListener("input", suggest);
$("q").addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % Math.max(1, hits.length);
    [...$("sugg").children].forEach((b, i) => b.setAttribute("aria-selected", String(i === sel))); }
  else if (e.key === "Enter" && hits[sel]) { open(hits[sel].id); $("sugg").hidden = true; }
  else if (e.key === "Escape") $("sugg").hidden = true;
});
$("sugg").addEventListener("click", e => { const b = e.target.closest("[data-id]"); if (b) { open(b.dataset.id); $("sugg").hidden = true; } });
document.addEventListener("click", e => { if (!e.target.closest(".find")) $("sugg").hidden = true; });

const PART_NOTE = {

const cache = {};
async function loadCell(c) {
  if (cache[c.id]) return cache[c.id];
  const txt = await (await fetch(c.file)).text();
  const P = [];                                   // [x,y,z,r,type,parentIndex]

  const xyz = at ? `(${[0, 1, 2].map(j => +(at[j] + G.off[j]).toFixed(3)).join(", ")})` : "None";
  return t.replaceAll("{SWC_FILE}", swc).replaceAll("{NAME}", C.name.replace(/"/g, "'")).replaceAll("{ID}", C.id).replaceAll("{AMP_NA}", nTrim(p.amp ?? 0.5))
    .replaceAll("{NA_SCALE}", nTrim(p.na ?? 1)).replaceAll("{K_SCALE}", nTrim(p.k ?? 1)).replaceAll("{DEND_FRAC}", nTrim((p.dend ?? 2) / 100)).replaceAll("{SITE_XYZ}", xyz)
    .replaceAll("{SITE_LABEL}", el ? markText(el) : "soma").replaceAll("{G_RATIO}", nTrim(p.g ?? 5)).replaceAll("{NU_RATIO}", nTrim(p.nu ?? 2));
}
async function giveScript(kind) {
  await saveFile(`${C.id}_${kind}.py`, new Blob([script(kind)], {type: "text/x-python"}));
  if (kind !== "brian2_network") { const swc = await (await fetch(C.file)).blob(); await saveFile(C.file.split("/").pop(), swc); }
}
$("spy").onclick = async () => { const k = scriptKind(), b = $("spy"), t = b.textContent; b.textContent = "Saving…"; await giveScript(k); b.textContent = "Saved ✓"; setTimeout(() => b.textContent = t, 2500); };
$("sman").addEventListener("click", async e => { if (e.target.id === "sextpy") { e.target.textContent = "Saving…"; await giveScript(scriptKind()); e.target.textContent = "saved ✓"; } });
/* save the run to Runs (online), reopen from there into this view */
const capDb = n => window.HS_BACKEND ? window.HS_BACKEND.use(n).catch(() => null) : (window.claude && typeof window.claude.use === "function") ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
$("ssave").onclick = async () => {
  const b = $("ssave"), m = model(), p = R.p, isBase = R === RB; b.disabled = true; b.textContent = "Saving…";
  const chg = isBase ? [] : changes(p, R.marks || []), sum = R.summary.replace(/<[^>]+>/g, "").split(" · ")[0];
  const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())), created = new Date().toISOString(), base = pbase();
  const q = new URLSearchParams({model: cfg.model, test: cfg.test, sim: cfg.sim});
  if (!isBase) { Object.entries(p).forEach(([k, v]) => { if (!same(v, base[k])) q.set(k, String(v)); }); if ((R.marks || []).length) q.set("marks", R.marks.map(x => x.kind + ":" + x.pt).join(",")); }
  const href = `index.html#${encodeURIComponent(C.id)}?${q}`;
  const entry = {id, created, label: `${C.name} ${C.code || ""} · ${m.tag} · ${test().name} · ${isBase ? "baseline" : chg.length + " change" + (chg.length > 1 ? "s" : "")} · ${sum}`.replace(/\s+/g, " "), note: "", tool: "atlas", route: "/atlas/", tool_name: "Neurons · " + m.name,
    page: "index.html", href, perturbations: [], n_changed: chg.length, changes: chg, values: [], stored: true, n_figs: 1};
  try {
    const [db, user] = await Promise.all([capDb("db"), capDb("user")]); if (!db || !user) throw new Error("saving needs the online version");
    const uid = await user.id(), ref = db.doc("runs/" + uid), cur = await ref.get(), v = cur.exists ? cur.data() : {entries: [], folders: []};
    const fig = $("trace").toDataURL("image/png"), item = db.doc(`runs/${uid}/items/${id}`);
    const data = R.plot === "pop" ? {rate: R.rate.map(([t, r]) => [t, +r.toFixed(1)])} : R.plot === "xy" ? {x: R.x, y: R.y.map(y => +y.toFixed(3)), xl: R.xl, yl: R.yl}
      : {t: R.t.filter((_, k) => k % 5 === 0), vSoma: R.vSoma.filter((_, k) => k % 5 === 0).map(x => +x.toFixed(2))};
    await item.set({figures: ["figures/result.png"], run: {schema: "hippsim.atlas-run/1.2", id, created, cell: {id: C.id, name: C.name, code: C.code, source: C.cite}, scale: cfg.scale, model: cfg.model, model_name: m.name,
      test: cfg.test, test_name: test().name, simulator: cfg.sim, params: p, marks: (R.marks || []).map(x => ({kind: x.kind, point: x.pt, where: markText(x)})), baseline: isBase, changes: chg,
      summary: R.summary.replace(/<[^>]+>/g, ""), readout: R.readout, ...data}, saved: created});
    if (fig.length < 180000) await item.collection("figs").doc("0").set({name: "figures/result.png", data: fig});
    v.entries = [entry, ...(v.entries || [])]; await ref.set({entries: v.entries, folders: v.folders || [], updated: created});
    b.textContent = "Saved ✓ in Runs";
  } catch (e) { b.textContent = "Not saved"; b.title = e.message; b.disabled = false; }
};

renderIndex();
/* address: #<cell id>[?model=…&test=…&sim=…&<param>=…&marks=kind:point,…] (Runs reopens saved runs this way) */
async function route() {
  const [h, q] = location.hash.slice(1).split("?"), start = decodeURIComponent(h || "");
  if (!start) { if (!$("viewer").hidden) close(); return; }
  if (!D.cells.some(c => c.id === start)) return;
  await open(start, false);
  if (!q) return;
  const a = new URLSearchParams(q), mk = a.get("model") || (a.has("amp") ? "hh" : null); if (!mk || !MOD[mk]) return;
  if (!a.has("test") && a.has("site")) a.set("marks", "electrode:" + a.get("site"));      // 0.9–0.10 links
  cfg = {scale: MOD[mk].scale, model: mk, test: a.get("test") || MOD[mk].tests[0], sim: a.get("sim") || "hippsim"}; openSim(true); renderSetup();
  await runModel(true);
  allParams().forEach(x => { if (a.has(x.k)) setCtl(x.k, x.type === "toggle" ? a.get(x.k) === "true" : a.get(x.k)); });
  marks = (a.get("marks") || "").split(",").filter(Boolean).map(s => { const [kind, pt] = s.split(":"); return {kind, pt: +pt}; }).filter(m => TOOLS[m.kind] && G.P[m.pt]);
  renderMarks(); syncOut(); draw();
  if (changes().length) { $("smanip").click(); await runModel(false); }
}
route(); addEventListener("hashchange", route);
